<svg xmlns="http://www.w3.org/2000/svg" class="fx" aria-hidden="true" focusable="false">
<defs>
  <filter id="print-fx" x="-2%" y="-2%" width="104%" height="104%">
    <!-- Clean misregister: shift the FX twin slightly — no turbulence scribbles on borders -->
    <feOffset in="SourceGraphic" dx="1.25" dy="0.85"/>
  </filter>
  <filter id="dither-3" color-interpolation-filters="sRGB">
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="0.1 0.55 1"/>
      <feFuncG type="discrete" tableValues="0.1 0.55 1"/>
      <feFuncB type="discrete" tableValues="0.1 0.55 1"/>
    </feComponentTransfer>
  </filter>
</defs>
</svg>
