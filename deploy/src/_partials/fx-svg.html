<svg
  xmlns="http://www.w3.org/2000/svg"
  class="fx"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <filter id="print-fx" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence
        type="turbulence"
        baseFrequency="0.013"
        numOctaves="1"
        seed="0"
        result="noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="0.7"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
    <filter id="dither-3" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues="0.1 0.55 1" />
        <feFuncG type="discrete" tableValues="0.1 0.55 1" />
        <feFuncB type="discrete" tableValues="0.1 0.55 1" />
      </feComponentTransfer>
    </filter>
  </defs>
</svg>
